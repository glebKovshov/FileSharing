[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filesharing-qt"
version = "2.0.0"
description = "Simple cross-platform LAN file sharing with Qt 6"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.18"]

[project.gui-scripts]
filesharing = "filesharing.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
